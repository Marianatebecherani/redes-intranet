# Redes Intranet: três réplicas idênticas da aplicação e um MySQL.
# O nginx (proxy reverso e balanceamento) roda fora do Docker e encaminha para as portas 3001, 3002 e 3003.
# Copie .env.example para .env e defina as senhas antes de subir o ambiente.
name: redes-intranet

x-app: &app
  build: .
  image: redes-intranet-app:latest
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  volumes:
    # Pastas compartilhadas do host, montadas nas três réplicas.
    - ${SHARE_ADMIN_HOST_DIR:-./compartilhamento/admin}:/compartilhamento/admin
    - ${SHARE_GERAL_HOST_DIR:-./compartilhamento/geral}:/compartilhamento/geral

x-app-env: &app-env
  DB_HOST: db
  DB_PORT: 3306
  DB_USER: ${MYSQL_USER:-intranet}
  DB_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no arquivo .env}
  DB_NAME: ${MYSQL_DATABASE:-intranet}
  JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-100}

services:
  app1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_NAME: app1
    ports:
      - ${APP_BIND_ADDRESS:-127.0.0.1}:3001:3000

  app2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_NAME: app2
    ports:
      - ${APP_BIND_ADDRESS:-127.0.0.1}:3002:3000

  app3:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_NAME: app3
    ports:
      - ${APP_BIND_ADDRESS:-127.0.0.1}:3003:3000

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no arquivo .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-intranet}
      MYSQL_USER: ${MYSQL_USER:-intranet}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no arquivo .env}
    volumes:
      - mysql-data:/var/lib/mysql
      # Executados apenas na primeira inicialização do volume.
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Usa TCP: durante a inicialização o MySQL temporário não escuta na rede,
      # então o serviço só fica saudável depois que os scripts terminam.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql-data:
